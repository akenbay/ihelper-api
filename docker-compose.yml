# Локальная разработка. В Dokploy Postgres внешний — там задаётся только DATABASE_URL.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ihelper
      POSTGRES_PASSWORD: ihelper
      POSTGRES_DB: ihelper
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ihelper"]
      interval: 5s
      retries: 5

  api:
    build: .
    command: sh -c "python manage.py migrate && gunicorn ihelper.wsgi --bind 0.0.0.0:8000 --access-logfile -"
    environment:
      SECRET_KEY: dev-secret-key
      DEBUG: "True"
      DATABASE_URL: postgres://ihelper:ihelper@db:5432/ihelper
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
